# Relevé des prix 4 fois par jour (heure de Paris en été : 6h, 12h, 18h, 22h),
# sauvegarde de l'historique dans le dépôt et publication du site sur GitHub Pages.
name: Relevé des prix

on:
  schedule:
    - cron: "0 4 * * *"   # 6h Paris : relevé + résumé du matin sur l'appli
    - cron: "0 10 * * *"
    - cron: "0 16 * * *"
    - cron: "0 20 * * *"
  workflow_dispatch:       # bouton "Run workflow" pour lancer à la main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: Europe/Paris
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Navigateur (options de réservation)
        run: python -m playwright install --with-deps chromium
      - name: Relevé
        run: |
          if [ "${{ github.event.schedule }}" = "0 4 * * *" ]; then python run.py --digest; else python run.py; fi
      - name: Sauvegarde de l'historique
        if: always()
        run: |
          git config user.name "tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.db site/index.html
          git commit -m "Relevé du $(date +'%d/%m %Hh%M')" || echo "Rien de nouveau"
          git push
      - uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: site

  deploy:
    needs: track
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
